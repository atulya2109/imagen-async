apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: worker
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-redis
          image: busybox:latest
          command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done']
        - name: wait-for-minio
          image: busybox:latest
          command: ['sh', '-c', 'until wget -q --spider http://minio:9000/minio/health/live; do echo waiting for minio; sleep 2; done']
      containers:
        - name: worker
          image: diffusion-queue-worker
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: imagen-secrets
                  key: database-url
            - name: REDIS_HOST
              value: redis
            - name: S3_ENDPOINT
              value: http://minio:9000
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: imagen-secrets
                  key: minio-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: imagen-secrets
                  key: minio-secret-key
